<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能选图 Design QA 对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #0d0d0d; color: #eee; font-family: Inter, "PingFang SC", sans-serif; }
      header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 14px; }
      h1 { margin: 0; font-size: 18px; }
      p { margin: 0; color: #858585; font-size: 11px; }
      .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #333; border-radius: 8px; background: #171717; }
      figcaption { padding: 9px 11px; border-bottom: 1px solid #333; color: #bdbdbd; font-size: 11px; }
      .full { width: 100%; aspect-ratio: 1.629; object-fit: cover; object-position: center top; }
      .focus { position: relative; height: 172px; overflow: hidden; border-top: 1px solid #333; }
      .focus img { position: absolute; top: -150px; left: 0; width: 100%; aspect-ratio: 1.629; object-fit: cover; object-position: center top; }
      .focus::after { content: "复核内容区焦点"; position: absolute; right: 8px; bottom: 8px; padding: 4px 6px; border-radius: 3px; background: rgba(0,0,0,.75); color: #aaa; font-size: 9px; }
    </style>
  </head>
  <body>
    <header><h1>QRaw 智能选图复核工作台 · 视觉对照</h1><p>相同深色主题、桌面状态与内容密度</p></header>
    <main class="comparison">
      <figure>
        <figcaption>视觉源：已选 Option 1</figcaption>
        <img class="full" src="/src/assets/reference/smart-culling-option-1.png" alt="源设计" />
        <div class="focus"><img src="/src/assets/reference/smart-culling-option-1.png" alt="源设计焦点" /></div>
      </figure>
      <figure>
        <figcaption>实现：全生命周期原型 · 复核页</figcaption>
        <img class="full" src="/@fs/Users/qiaopeng/Desktop/owner/QRaw/docs/prototypes/smart-culling-lifecycle/screenshots/06-review.png" alt="实现截图" />
        <div class="focus"><img src="/@fs/Users/qiaopeng/Desktop/owner/QRaw/docs/prototypes/smart-culling-lifecycle/screenshots/06-review.png" alt="实现焦点" /></div>
      </figure>
    </main>
  </body>
</html>
